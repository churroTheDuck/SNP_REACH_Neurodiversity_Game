<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <div class="scenario">
      <p>Something has happened</p>
    </div>

    <div class="options">
      <button>Option 1</button>
      <button>Option 2</button>
      <button>Option 3</button>
    </div>
    
    <div class="bars">
      <div class="bar">
        <div class="bar-fill social"></div>
        <span class="bar-label">Social</span>
      </div>
      <div class="bar">
        <div class="bar-fill academic"></div>
        <span class="bar-label">Academic</span>
      </div>
      <div class="bar">
        <div class="bar-fill mental"></div>
        <span class="bar-label">Mental</span>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
